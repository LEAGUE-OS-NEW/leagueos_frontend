services:
  - type: web
    name: leagueos-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    pullRequestPreviewsEnabled: true
    envVars:
      - key: VITE_API_BASE_URL
        sync: false
    routes:
      - type: redirect
        source: /fandashboard
        destination: /dashboard/fan
      - type: rewrite
        source: /*
        destination: /index.html
    branch: development
